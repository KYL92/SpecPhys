BASE:
- ''
TOOLBOX_MODE: train_and_test
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: /SPECPHYS_ROOT/_workspace/data/physformer/runs/finetune_NF_HYB_L
MODEL:
  DROP_RATE: 0.1
  NAME: FactorizePhys
  FactorizePhys:
    CHANNELS: 3
    FRAME_NUM: 160
    MD_FSAM: true
    MD_TYPE: NMF
    MD_TRANSFORM: T_KAB
    MD_R: 1
    MD_S: 1
    MD_STEPS: 4
    MD_RESIDUAL: true
    MD_INFERENCE: true
  RESUME: /SPECPHYS_ROOT/repos/rPPG-Toolbox/final_model_release/UBFC-rPPG_FactorizePhys_FSAM_Res.pth
  MODEL_DIR: /SPECPHYS_ROOT/_workspace/data/physformer/runs/finetune_NF_HYB_L/PreTrainedModels
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 10
  LR: 1e-4
  MODEL_FILE_NAME: SYNTH_NF_HYB_L_factorizephys
  PLOT_LOSSES_AND_LR: false
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: true
    DATA_FORMAT: NCDHW
    DATA_PATH: /SPECPHYS_ROOT/_workspace/data/physformer/COTRAIN_ALLF_HYB4
    CACHED_PATH: /SPECPHYS_ROOT/_workspace/data/physformer/cache
    EXP_DATA_NAME: fp_cotrain_allf_hyb4
    BEGIN: 0.0
    END: 1.0
    PREPROCESS:
      DATA_TYPE:
      - Raw
      DATA_AUG:
      - None
      LABEL_TYPE: Standardized
      DO_CHUNK: true
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: HC
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: false
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
      RESIZE:
        H: 72
        W: 72
VALID:
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: false
    DATA_FORMAT: NCDHW
    DATA_PATH: /SPECPHYS_ROOT/_workspace/data/physformer/TRAIN20
    CACHED_PATH: /SPECPHYS_ROOT/_workspace/data/physformer/cache
    EXP_DATA_NAME: fp_synth_train20
    BEGIN: 0.9
    END: 1.0
    PREPROCESS:
      DATA_TYPE:
      - Raw
      DATA_AUG:
      - None
      LABEL_TYPE: Standardized
      DO_CHUNK: true
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: HC
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: false
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
      RESIZE:
        H: 72
        W: 72
TEST:
  METRICS:
  - MAE
  - RMSE
  - MAPE
  - Pearson
  - SNR
  USE_LAST_EPOCH: true
  OUTPUT_SAVE_DIR: /SPECPHYS_ROOT/_workspace/data/physformer/runs/finetune_NF_HYB_L/outputs
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: false
    DATA_FORMAT: NCDHW
    DATA_PATH: /SPECPHYS_ROOT/_workspace/data/physformer/REALTEST
    CACHED_PATH: /SPECPHYS_ROOT/_workspace/data/physformer/cache
    EXP_DATA_NAME: fp_real_test
    BEGIN: 0.0
    END: 1.0
    PREPROCESS:
      DATA_TYPE:
      - Raw
      DATA_AUG:
      - None
      LABEL_TYPE: Standardized
      DO_CHUNK: true
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: HC
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: false
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
      RESIZE:
        H: 72
        W: 72
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: FFT
