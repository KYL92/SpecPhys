BASE:
- ''
TOOLBOX_MODE: train_and_test
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 10
  LR: 0.0001
  MODEL_FILE_NAME: UBFC_PURE_RhythmFormer
  PLOT_LOSSES_AND_LR: false
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: false
    DATA_FORMAT: NDCHW
    DATA_PATH: /data/UBFC-rPPG/DATASET_2
    CACHED_PATH: /data/PreprocessedData/experienment0/UBFC
    EXP_DATA_NAME: rf_tpl
    BEGIN: 0.0
    END: 0.8
    PREPROCESS:
      DATA_TYPE:
      - Standardized
      DATA_AUG:
      - None
      LABEL_TYPE: Standardized
      DO_CHUNK: true
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: HC
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: false
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
      RESIZE:
        H: 128
        W: 128
VALID:
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: false
    DATA_FORMAT: NDCHW
    DATA_PATH: /data/UBFC-rPPG/DATASET_2
    CACHED_PATH: /data/PreprocessedData/experienment0/UBFC
    EXP_DATA_NAME: rf_tpl
    BEGIN: 0.8
    END: 1.0
    PREPROCESS:
      DATA_TYPE:
      - Standardized
      DATA_AUG:
      - None
      LABEL_TYPE: Standardized
      DO_CHUNK: true
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: HC
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: false
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
      RESIZE:
        H: 128
        W: 128
TEST:
  METRICS:
  - MAE
  - RMSE
  - MAPE
  - Pearson
  - SNR
  - BA
  USE_LAST_EPOCH: true
  DATA:
    FS: 30
    DATASET: PURE
    DO_PREPROCESS: false
    DATA_FORMAT: NDCHW
    DATA_PATH: /data/PURE
    CACHED_PATH: /data/PreprocessedData/experienment0/PURE
    EXP_DATA_NAME: rf_tpl
    BEGIN: 0.0
    END: 1.0
    PREPROCESS:
      DATA_TYPE:
      - Standardized
      LABEL_TYPE: Standardized
      DO_CHUNK: true
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: HC
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: false
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
      RESIZE:
        H: 128
        W: 128
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/exp
MODEL:
  NAME: RhythmFormer
  DROP_RATE: 0.2
  RESUME: /SPECPHYS_ROOT/repos/rPPG-Toolbox/final_model_release/UBFC-rPPG_RhythmFormer.pth
  MODEL_DIR: /SPECPHYS_ROOT/_workspace/data/physformer/runs/finetune_TPL/PreTrainedModels
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: FFT
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: false
    WINDOW_SIZE: 10
  MODEL_PATH: ''
